[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-llm-inference-router"
version = "0.1.0"
description = "Workload-aware routing across decode, cache, speculative, and long-context inference paths."
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
